<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Página HTML de prueba para GitHub Pages.">
  <title>Test GitHub Pages</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f8fb;
      color: #172033;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at top left, rgba(64, 120, 255, 0.22), transparent 32rem),
        linear-gradient(135deg, #f6f8fb 0%, #e9eef8 100%);
    }
    main {
      width: min(100%, 720px);
      padding: clamp(2rem, 6vw, 4rem);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 24px 70px rgba(23, 32, 51, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.65);
      text-align: center;
      backdrop-filter: blur(12px);
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.2rem, 8vw, 4.8rem);
      line-height: 1;
      letter-spacing: -0.06em;
    }
    p {
      margin: 0;
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: #526070;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding: 0.5rem 0.85rem;
      border-radius: 999px;
      background: #172033;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(circle at top left, rgba(105, 149, 255, 0.28), transparent 32rem),
          linear-gradient(135deg, #101624 0%, #172033 100%);
      }
      main {
        background: rgba(20, 28, 45, 0.82);
        border-color: rgba(255, 255, 255, 0.12);
      }
      p {
        color: #c4ccda;
      }
      .badge {
        background: white;
        color: #172033;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">GitHub Pages</div>
    <h1>Test GitHub Pages</h1>
    <p>Página HTML de prueba publicada desde ChatGPT.</p>
  </main>
</body>
</html>
